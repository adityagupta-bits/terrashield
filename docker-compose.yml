version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: terrashield-postgis
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrashield_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-terrashield}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-terrashield}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terrashield-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-terrashield_secure_pwd}@db:5432/${POSTGRES_DB:-terrashield}
      JWT_SECRET: ${JWT_SECRET:-terrashield_super_secret_jwt_key_2026}
      JWT_EXPIRE_MINUTES: 1440
      DEMO_MODE: "true"
      CORS_ORIGINS: "*"
      WHATSAPP_PROVIDER: mock
    ports:
      - "8000:8000"

volumes:
  postgis_data:
